name: 每周更新看板

on:
  schedule:
    - cron: '0 1 * * 1'   # 每周一 01:00 UTC = 北京时间 09:00
  workflow_dispatch:        # 允许在 Actions 页面手动触发

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 抓取 GitHub 数据
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/fetch.py

      - name: 自动翻译新项目描述
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python3 scripts/translate.py

      - name: 生成看板网页
        run: python3 scripts/render.py

      - name: 提交并发布
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/translate_cache.json history/ dist/index.html
          git diff --cached --quiet || git commit -m "chore: 每周数据更新 $(date +%F)"
          git push
